name: Build Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Build release v0.1.0+26.2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build release JAR
        run: gradle build

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          JAR="build/libs/dmonsters-${VERSION}.jar"
          test -f "$JAR"
          git fetch origin main
          TARGET_SHA="$(git rev-parse origin/main)"
          cat > release-notes.md <<'EOF'
          Deadly Monsters port for Minecraft 26.2 / NeoForge 26.2.0.75.

          - Full Forge 1.12.2 -> NeoForge 26.2 code/resource migration.
          - Includes all 12 original monsters, gameplay blocks/items, renderers, recipes, loot, sounds, configuration and natural spawning.
          - Built with Java 25 and Gradle 9.2.1.
          - Repository build/package verification passed; interactive gameplay/server validation remains for the maintainer's release test pass.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Deadly Monsters ${VERSION}" \
              --notes-file release-notes.md
          fi
