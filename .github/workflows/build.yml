name: Release v1.0-26.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build with Gradle
        run: gradle build

      - name: Verify release JAR
        run: test -f build/libs/dmonsters-1.0-26.2.jar

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0-26.2" \
            "build/libs/dmonsters-1.0-26.2.jar#dmonsters-1.0-26.2.jar" \
            --target "$GITHUB_SHA" \
            --title "Deadly Monsters v1.0-26.2" \
            --notes-file - <<'EOF'
          Deadly Monsters for Minecraft 26.2 / NeoForge 26.2.0.75.

          - Fixed missing Soul Eye and Christmas Tree inventory models.
          - Restored monster sound playback by normalizing sound resource paths.
          - Added the previously unused Zombie Chicken sound set.
          - Cleaned legacy sound definition fields for the modern resource loader.
          - Restored Rebar block-edit permission checks.
          - Includes the complete NeoForge 26.2 port of all original monsters, blocks, items, recipes, loot, configuration and natural spawning.
          EOF
