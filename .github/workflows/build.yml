name: 重建 v1.0-26.2 Release

on:
  push:
    branches:
      - 'fabric/26.2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 NeoForge 发布源码
        uses: actions/checkout@v4
        with:
          ref: 'c17e2b4315a9b3795258383a23a73a2ee1732b22'
          path: neoforge
          fetch-depth: 0

      - name: 检出 Fabric 发布源码
        uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          path: fabric
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 配置 NeoForge 构建环境
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: 构建 NeoForge
        working-directory: neoforge
        run: gradle build

      - name: 配置 Fabric 构建环境
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: 构建 Fabric
        working-directory: fabric
        run: gradle build

      - name: 整理并校验两个 JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          cp neoforge/build/libs/dmonsters-1.0-26.2.jar release-assets/dmonsters-neoforge-1.0-26.2.jar
          cp fabric/build/libs/dmonsters-fabric-1.0-26.2.jar release-assets/dmonsters-fabric-1.0-26.2.jar

          test -s release-assets/dmonsters-neoforge-1.0-26.2.jar
          test -s release-assets/dmonsters-fabric-1.0-26.2.jar
          jar tf release-assets/dmonsters-neoforge-1.0-26.2.jar | grep -Eq 'META-INF/neoforge.mods.toml|META-INF/mods.toml'
          jar tf release-assets/dmonsters-fabric-1.0-26.2.jar | grep -Fx 'fabric.mod.json'

          sha256sum release-assets/*.jar

      - name: 创建唯一 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<'EOF'
          Deadly Monsters 的 Minecraft 26.2 版本

          下载时按你使用的加载器选择对应文件

          - **NeoForge 26.2.0.75** — `dmonsters-neoforge-1.0-26.2.jar`
          - **Fabric Loader 0.19.5** — `dmonsters-fabric-1.0-26.2.jar`，需要 Fabric API 0.159.0+26.2

          两个版本不要同时安装
          EOF

          gh release create 'v1.0-26.2' \
            'release-assets/dmonsters-neoforge-1.0-26.2.jar#dmonsters-neoforge-1.0-26.2.jar' \
            'release-assets/dmonsters-fabric-1.0-26.2.jar#dmonsters-fabric-1.0-26.2.jar' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Deadly Monsters v1.0-26.2' \
            --notes-file release-notes.md
