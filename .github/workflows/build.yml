name: 构建 NeoForge 1.21.1

on:
  push:
    branches:
      - 'neoforge/1.21.1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 应用 1.21.1 回迁
        run: python3 .github/backport_1211.py

      - name: 写回源码回迁
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          if ! git diff --cached --quiet; then
            git commit -m '回迁 NeoForge 1.21.1 行为接口 [skip ci]'
            git push origin HEAD:neoforge/1.21.1
          fi

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 配置 Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: 构建模组
        run: gradle build
