name: 整理 v1.0-26.2 Release

on:
  push:
    branches:
      - 'fabric/26.2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy-release:
    runs-on: ubuntu-latest
    steps:
      - name: 下载现有 NeoForge 与 Fabric 构建
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          gh release download 'v1.0-26.2' \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'dmonsters-1.0-26.2.jar' \
            --dir release-assets

          gh release download 'v1.0-26.2-fabric' \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'dmonsters-fabric-1.0-26.2.jar' \
            --dir release-assets

          echo '6a312e7f4a63f8b7991d2756f2ebb7bebea31438528f5cf7bdb33e73d7da52d6  release-assets/dmonsters-1.0-26.2.jar' | sha256sum -c -
          echo '75a2b6a93675c225cab9656a0c4ae8d2c52d5c8089953e7b7a28c0ad9ca96340  release-assets/dmonsters-fabric-1.0-26.2.jar' | sha256sum -c -

          mv release-assets/dmonsters-1.0-26.2.jar release-assets/dmonsters-neoforge-1.0-26.2.jar

      - name: 清理旧 Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [[ -n "$tag" ]] || continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

      - name: 创建统一 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<'EOF'
          Deadly Monsters 的 Minecraft 26.2 版本

          下载时按你使用的加载器选择对应文件

          - **NeoForge 26.2.0.75** — `dmonsters-neoforge-1.0-26.2.jar`
          - **Fabric Loader 0.19.5** — `dmonsters-fabric-1.0-26.2.jar`，需要 Fabric API 0.159.0+26.2

          两个版本不要同时安装
          EOF

          gh release create 'v1.0-26.2' \
            'release-assets/dmonsters-neoforge-1.0-26.2.jar#dmonsters-neoforge-1.0-26.2.jar' \
            'release-assets/dmonsters-fabric-1.0-26.2.jar#dmonsters-fabric-1.0-26.2.jar' \
            --repo "$GITHUB_REPOSITORY" \
            --target 'd1b34b8304e8fae3eeb9125ebd8fc53d6023fa99' \
            --title 'Deadly Monsters v1.0-26.2' \
            --notes-file release-notes.md
